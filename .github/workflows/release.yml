# Every push to main publishes the next patch release (v0.1.0 → v0.1.1 → …):
# tests, four static binaries, checksums.txt, and a GitHub release that
# `lazymage --update`, the U key and install.sh pick up.
#
# Skip a release:  put [skip release] in the commit message, or change only
#                  Markdown / docs (paths-ignore below).
# Minor / major:   Actions → release → Run workflow → bump: minor | major
#                  (or scripts/release.sh minor).
name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

# Releases run one at a time, in push order, so two quick pushes can't
# compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, to find the latest version

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Next version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          # [skip release] counts only in the commit's subject line, so a
          # message body that merely mentions it doesn't skip a release.
          if [ "$GITHUB_EVENT_NAME" = push ] && git log -1 --format=%s | grep -qF '[skip release]'; then
            echo "[skip release] in the commit subject; not releasing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A re-run of a push that was already released does nothing; a
          # manual minor / major bump may tag a commit a second time.
          if [ "$GITHUB_EVENT_NAME" = push ] && tag="$(git describe --tags --exact-match --match 'v[0-9]*' HEAD 2>/dev/null)"; then
            echo "HEAD is already released as $tag; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
          latest="${latest:-v0.0.0}"
          IFS=. read -r major minor patch <<< "${latest#v}"
          patch="${patch%%-*}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *)     patch=$((patch + 1)) ;;
          esac
          next="v$major.$minor.$patch"
          echo "$latest → $next ($BUMP)"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}" arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" -o "dist/lazymage-$os-$arch" .
          done
          (cd dist && sha256sum lazymage-* > checksums.txt && cat checksums.txt)

      - name: Publish
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --title "lazymage $TAG" --generate-notes
